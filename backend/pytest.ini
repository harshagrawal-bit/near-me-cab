[pytest]
asyncio_mode = auto
# The Motor client is created once for the suite, so fixtures and tests must
# share one event loop — otherwise every query fails with "attached to a
# different loop". Test modules opt in via
# `pytestmark = pytest.mark.asyncio(loop_scope="session")`.
asyncio_default_fixture_loop_scope = session
testpaths = tests
python_files = test_*.py
addopts = -q --strict-markers
filterwarnings =
    ignore::DeprecationWarning
